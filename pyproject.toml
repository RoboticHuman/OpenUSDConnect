[project]
name = "openusdconnect"
version = "0.1.0"
description = "General-purpose real-time USD sync framework for DCC livelink"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Blender integration tests: configure via one of:
#   uv run pytest --blender /path/to/blender.exe
#   BLENDER_EXE=/path/to/blender.exe uv run pytest
#   echo /path/to/blender.exe > blender.test.cfg

[project.scripts]
openusdconnect-server = "openusdconnect.server:main"
