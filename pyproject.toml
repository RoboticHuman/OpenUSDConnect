[build-system]
requires = [
    "scikit-build-core>=1.0,<2",
    "nanobind>=2.11,<3",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["openusdconnect"]
wheel.py-api = "cp312"
sdist.include = [
    ".python-version",
    "CMakeLists.txt",
    "openusdconnect/*.py",
    "openusdconnect/**/*.py",
    "openusdconnect/schema/*.fbs",
    "native/**",
    "integrations/__init__.py",
    "integrations/dashboard/**",
    "integrations/mcp/**",
    "integrations/openpbr_translate.py",
    "integrations/renderman.py",
    "integrations/usdview/**",
    "openusd.lock.json",
    "scripts/build_openusd.py",
    "LICENSE",
    "NOTICE",
    "README.md",
    "pyproject.toml",
]
sdist.exclude = [
    ".blender/**",
    ".openusd/**",
    ".tmp/**",
    "assets/**",
    "build/**",
    "dist/**",
]
[tool.scikit-build.wheel.force-include]
"native/sdf_notice_bridge" = "openusdconnect/native/sdf_notice_bridge"
"integrations/__init__.py" = "integrations/__init__.py"
"integrations/dashboard" = "integrations/dashboard"
"integrations/mcp" = "integrations/mcp"
"integrations/openpbr_translate.py" = "integrations/openpbr_translate.py"
"integrations/renderman.py" = "integrations/renderman.py"
"integrations/usdview" = "integrations/usdview"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "openusdconnect/_version.py"

[project]
name = "openusdconnect"
dynamic = ["version"]
description = "General-purpose real-time USD sync framework for DCC livelink"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "cachetools==7.0.5",
    "flatbuffers==25.12.19",
    "numpy==2.4.4",
]

[project.optional-dependencies]
# Customer-facing installation profiles. Dependency groups below remain the
# contributor environments used by uv sync.
server = [
    "cheroot==10.0.1",
    "nicegui==3.9.0",
    "usd-core==26.8",
    "wsgidav==4.3.3",
]
mcp = [
    "mcp>=1.2,<2",
    "usd-core==26.8",
]
complete = [
    "cheroot==10.0.1",
    "mcp>=1.2,<2",
    "nicegui==3.9.0",
    "usd-core==26.8",
    "wsgidav==4.3.3",
]

[tool.hatch.version]
path = "openusdconnect/_version.py"

[project.urls]
Repository = "https://github.com/RoboticHuman/OpenUSDConnect"

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "ruff==0.15.6",
]
dashboard = [
    "nicegui==3.9.0",
]
bundled-usd = [
    "usd-core==26.8",
]
vfs = [
    "cheroot==10.0.1",
    "wsgidav==4.3.3",
]
mcp = [
    "mcp>=1.2,<2",
]
profile = [
    "py-spy==0.4.2",
]
usdview = [
    "PyOpenGL==3.1.10",
    "PySide6==6.11.0",
]
visual = [
    "flip-evaluator==1.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "materialx: MaterialX shader mapper integration tests (require Blender)",
    "slow: timing-dependent tests that wait out real intervals; opt in with --slow-tests",
    "unreal: Unreal Editor integration tests; opt in with --unreal-tests",
]
# Blender integration tests: configure via one of:
#   uv run pytest --blender /path/to/blender.exe
#   BLENDER_EXE=/path/to/blender.exe uv run pytest
#   echo /path/to/blender.exe > blender.test.cfg

[project.scripts]
openusdconnect-server = "openusdconnect.server:main"
openusdconnect-mount-vfs = "openusdconnect.vfs_mount:main"
openusdconnect-send = "openusdconnect.send:main"
openusdconnect-build-sdf-notice-bridge = "openusdconnect.build_sdf_notice_bridge:main"
openusdconnect-mcp = "integrations.mcp.cli:main"
openusdconnect-usdview = "integrations.usdview.launcher:main"

# --- Ruff (linter + formatter) ---
# Docs: https://docs.astral.sh/ruff/
#
# Quick reference:
#   uv run ruff check              # lint (report only)
#   uv run ruff check --fix        # lint + auto-fix safe issues
#   uv run ruff format             # auto-format all files
#   uv run ruff format --diff      # preview formatting changes
#
# Adding a new rule set:
#   Browse available rules at https://docs.astral.sh/ruff/rules/
#   Add the code prefix to the "select" list below (e.g. "SIM" for simplify).
#
# Ignoring a rule for a specific file:
#   Add an entry to [tool.ruff.lint.per-file-ignores] below.
#   Globs work: "tests/blender_*_script.py" = ["E402"]
#
# Ignoring a rule on a single line:
#   Append a comment: some_code()  # noqa: E501
#
[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["vendor/", "assets/", "openusdconnect/generated/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (e.g. E501 line too long)
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernize syntax for target-version)
    "B",    # bugbear (common pitfalls like mutable default args)
]

[tool.ruff.lint.per-file-ignores]
# E402 = "module level import not at top of file"
# I001 = "import block is unsorted"
# These are ignored where imports must come after sys.path setup or conditional guards.
"openusdconnect/__init__.py" = ["E402"]
"integrations/blender/__init__.py" = ["E402", "I001"]
"tests/integration/scripts/*.py" = ["E402", "E501", "F841", "B007"]
"tests/unit/test_roundtrip.py" = ["E402"]
"tests/unit/test_event_apply.py" = ["E402"]
"tests/unit/test_blender_stage_author.py" = ["E402"]
"tests/unit/test_stage_parity.py" = ["E402", "I001"]
"tests/unit/test_materialx_compose_parity.py" = ["E402", "I001"]
"tests/unit/test_api_schemas.py" = ["E402"]
"tests/unit/test_usdlux.py" = ["E402"]
"tests/unit/test_usdgeomcamera.py" = ["E402"]
"tests/unit/test_prim_channels.py" = ["E402"]
"tests/unit/test_time_samples.py" = ["E402"]
"tests/unit/test_stage_metadata.py" = ["E402"]
"tests/unit/test_playback_leader.py" = ["E402"]
"scripts/*.py" = ["E402", "E501"]
"integrations/unreal/connect.py" = ["E402"]
"tests/unit/test_mcp_*.py" = ["E402"]
"tests/integration/test_mcp_*.py" = ["E402"]

[tool.coverage.run]
source = ["openusdconnect"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff.format]
quote-style = "double"
