services:
  server:
    build:
      context: .
    ports:
      - "7200:7200"
      - "7280:7280"
      - "8080:8080"
    volumes:
      - ./scenes:/scenes
      - server-data:/data
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "7200"
      - "--base"
      - "/scenes/test_scene.usda"
      - "--event-log"
      - "/data/events.db"
      - "--dashboard-port"
      - "8080"
      - "--vfs-host"
      - "0.0.0.0"
      - "--vfs-port"
      - "7280"
      - "--advertise-host"
      - "127.0.0.1"
    profiles:
      - default

volumes:
  server-data:
